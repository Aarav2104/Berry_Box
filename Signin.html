<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global3.css" />
    <link rel="stylesheet" href="./Signin.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Metrophobic:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Meddon:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <div class="desktop-3">
      <section class="left-panel">
        <div class="vector">
          <img
            class="vector-icon"
            loading="lazy"
            alt=""
            src="./public/Vector.svg"
          />
        </div>
        <div class="welcome-to-berrybox-container">
          <span class="welcome-to-berrybox"
            >Welcome to BerryBox<br /><br
          /></span>
          <span>Your favorite moments deserve a safe place. </span>
          <span class="sign-in">Sign in</span>
          <span> to access your memories anytime, anywhere.</span>
        </div>
      </section>
      <section class="right-panel-form">
        <div class="berrybox">
          <div class="berrybox2">BerryBox</div>
        </div>
        <div class="email-parent">
          <div class="email">Email</div>
          <div class="frame">
            <input class="enter-email" placeholder="Enter Email" type="text" />
          </div>
        </div>
        <div class="password-parent">
          <div class="password">Password</div>
          <div class="frame2">
            <input class="password2" placeholder="Password" type="text" />
          </div>
        </div>
        <div class="checkbox-row">
          <input class="famiconscheckbox" type="checkbox" />

          <div class="i-agree-to">
            I agree to the processing of Personal data
          </div>
        </div>
        <button class="right-panel-form-inner">
          <div class="sign-in-wrapper">
            <div class="sign-in2">Sign in</div>
          </div>
        </button>
        <div class="divider-row">
          <div class="divider-row-inner">
            <div class="frame-child"></div>
          </div>
          <div class="sign-in-with">
            <div class="sign-in-with2">Sign in with</div>
          </div>
          <div class="divider-row-inner">
            <div class="frame-child"></div>
          </div>
        </div>
        <div class="logosfacebook-parent">
          <img
            class="logosfacebook-icon"
            alt=""
            src="./public/logos-facebook.svg"
          />

          <img
            class="logosfacebook-icon"
            alt=""
            src="./public/streamline-color-twitter-flat.svg"
          />

          <img
            class="logosfacebook-icon"
            alt=""
            src="./public/flat-color-icons-google.svg"
          />

          <img
            class="logosfacebook-icon"
            alt=""
            src="./public/devicon-apple.svg"
          />
        </div>
        <div class="dont-have-an-container">
          <span>Don't have an account? </span>
          <span class="sign-up">Sign up</span>
        </div>
      </section>
    </div>
    <script src="legacy.js?v=4"></script>
  </body>
</html>

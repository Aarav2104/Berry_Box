<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global4.css" />
    <link rel="stylesheet" href="./dashboard.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Meddon:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap"
    />
  </head>
  <body>
    <div class="desktop-4 profile-page">
      <section class="header">
        <div class="vector">
          <img
            class="vector-icon"
            loading="lazy"
            alt=""
            src="./public/Vector.svg"
          />
        </div>
        <div class="berrybox">
          <div class="berrybox2">BerryBox</div>
        </div>
        <div class="search-component"></div>
        <img
          class="streamline-flex-colorbell-not-icon"
          alt=""
          src="./public/streamline-flex-color_bell-notification-flat.svg"
        />

        <img
          class="merged-asset-1-icon"
          loading="lazy"
          alt=""
          src="./public/bi_person-circle.svg"
        />
      </section>
      <main class="main-body">
        <section class="sidebar-menu">
          <button class="gallery-link" type="button">
            <img
              class="iconamoonsearch-thin"
              alt=""
              src="./public/solar_gallery-linear.svg"
            />

            <div class="gallery">
              <div class="gallery2">Gallery</div>
            </div>
          </button>
          <button class="navigation-items" type="button">
            <div class="tablerphoto-plus-parent">
              <img
                class="iconamoonsearch-thin"
                alt=""
                src="./public/tabler_photo-plus.svg"
              />

              <div class="upload-photo">
                <div class="gallery2">Upload Photo</div>
              </div>
            </div>
          </button>
          <button class="favorites-link" type="button">
            <div class="favorites-wrapper">
              <div class="favorite-content">
                <img
                  class="iconamoonsearch-thin"
                  alt=""
                  src="./public/tabler_photo-star.svg"
                />

                <div class="favorites">
                  <div class="logout">Favorites</div>
                </div>
              </div>
            </div>
          </button>
          <button class="navigation-items2" type="button" disabled>
            <div class="iconamoonprofile-light-parent">
              <img
                class="iconamoonsearch-thin"
                alt=""
                src="./public/iconamoon_profile-light.svg"
              />

              <div class="profile">
                <div class="gallery2">Profile</div>
              </div>
            </div>
          </button>
          <button class="logout-button" type="button">
            <div class="logout">Logout</div>
          </button>
        </section>
        <section class="content-area">
          <div class="profile-panel">
            <div class="profile-avatar-row">
              <img class="profile-avatar" src="./public/bi_person-circle.svg" alt="" />
              <div>
                <h1 class="profile-name">BerryBox member</h1>
                <div class="profile-email">member@example.com</div>
              </div>
            </div>
            <div class="info-rows profile-info-rows">
              <div class="info-row-photos">
                <div class="photos-uploaded">Photos Uploaded</div>
                <div class="control-items profile-photo-count">0</div>
              </div>
              <div class="info-row-member">
                <div class="control-items">Member Since</div>
                <div class="control-items profile-member-since">September 2026</div>
              </div>
              <div class="info-row-photos">
                <div class="total-storage">Storage Used</div>
                <div class="control-items profile-storage-used">0.00 GB / 10 GB</div>
              </div>
            </div>
          </div>
        </section>
        <div class="berrybox-gallery-all">
          2026 BerryBox Gallery. All rights reserved.
        </div>
      </main>
    </div>
    <script src="legacy.js?v=4"></script>
  </body>
</html>
